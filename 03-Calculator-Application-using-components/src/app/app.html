<div class="container d-flex justify-content-center mt-5">
  <div class="card p-4" style="max-width: 400px;">
    <h2 class="text-center">Calculator Application</h2>
    <h1 class="text-primary text-center">{{result}}</h1>
    <input type="number" name="firstNumber" id="firstNumber" class="form-control m-3" [(ngModel)]="firstNumber">
    <input type="number" name="secondNumber" id="secondNumber" class="form-control m-3" [(ngModel)]="secondNumber">

    <app-calculator [firstNumber]="firstNumber" [secondNumber]="secondNumber" (resultChange)="updateResult($event)"></app-calculator>
  </div>
</div>
