<div class="d-flex justify-content-center gap-3">
    <button class="btn btn-primary" (click)="add()">+</button>
    <button class="btn btn-secondary" (click)="subtract()">-</button>
    <button class="btn btn-success" (click)="multiply()">*</button>
    <button class="btn btn-danger" (click)="divide()">/</button>
</div>
