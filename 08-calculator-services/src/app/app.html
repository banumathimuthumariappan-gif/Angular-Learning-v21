<div class="container">
  <div class="card text-center mt-3" style="max-width: 800px;">
    <h2>Calculator Application using Services</h2>
    <h1 class="text-primary">{{ result }}</h1>

    <div class="d-flex gap-3 justify-content-center mb-3">
      <input type="number" name="firstNumber" id="firstNumber" class="form-control ms-2" placeholder="Enter First Number" [(ngModel)]="firstNumber">
      <input type="number" name="secondNumber" id="secondNumber" class="form-control me-2" placeholder="Enter Second Number" [(ngModel)]="secondNumber">
    </div>

    <div class="d-flex gap-3 justify-content-center mb-3">
      <button class="btn btn-success" (click)="add(firstNumber, secondNumber)">+</button>
      <button class="btn btn-danger" (click)="subtract(firstNumber, secondNumber)">-</button>
      <button class="btn btn-primary" (click)="multiply(firstNumber, secondNumber)">*</button>
      <button class="btn btn-secondary" (click)="divide(firstNumber, secondNumber)">/</button>
    </div>
  </div>
</div>
