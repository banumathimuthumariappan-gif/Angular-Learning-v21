<div class="container">
  <div class="card mt-5">
    <div class="card-body">
      <table class="table table-bordered table-hover table-sm">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>UserId</th>
            <th>Title</th>
            <th>Body</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          @for (post of posts; track post.id) {
            <tr>
              <td>{{ post.id }}</td>
              <td>{{ post.userId }}</td>
              <td>{{ post.title }}</td>
              <td>{{ post.body }}</td>
              <td></td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
