<div class="d-flex gap-3 mb-5">
    <input type="number" name="firstNumber" id="firstNumber" placeholder="Enter First Number" class="form-control" [(ngModel)]="firstValue">
    <input type="number" name="secondNumber" id="secondNumber" placeholder="Enter Second Number" class="form-control" [(ngModel)]="secondValue">
    </div>
<div class="d-flex gap-3 justify-content-center">
    <button class="btn btn-primary" (click)="add()">+</button>
    <button class="btn btn-secondary" (click)="sub()">-</button>
    <button class="btn btn-success" (click)="mul()">*</button>
    <button class="btn btn-danger" (click)="div()">-</button>
</div>
